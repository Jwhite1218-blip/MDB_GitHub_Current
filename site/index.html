<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Mobile Drill Brain operational workspace demo."
    >
    <title>Mobile Drill Brain</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#mainContent">Skip to workspace</a>

    <header class="app-banner">
      <button id="homeButton" class="brand-button" type="button" aria-label="MDB home">
        <img
          src="assets/mobile-drill-logo-transparent.png"
          width="500"
          height="119"
          alt="Mobile Drill International"
        >
      </button>
      <span class="demo-pill">MDB Demo</span>
    </header>

    <main id="mainContent" class="application">
      <section id="homeView" class="home-view" aria-label="MDB home">
        <div class="home-search-wrap">
          <form id="globalSearchForm" class="global-search" novalidate>
            <label class="sr-only" for="globalSearchInput">Search MDB</label>
            <span class="search-mark" aria-hidden="true"></span>
            <input
              id="globalSearchInput"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search customer, tooling, quote, inventory, rig or serial..."
              aria-controls="globalSearchResults"
              aria-expanded="false"
            >
            <button type="submit">Search</button>
          </form>
          <div id="globalSearchResults" class="search-results" role="listbox" hidden></div>
        </div>

        <nav class="quick-nav" aria-label="Primary workspaces">
          <button type="button" data-open="customer">
            <span class="quick-icon quick-icon--customer" aria-hidden="true"></span>
            <span>Customer</span>
          </button>
          <button type="button" data-open="tooling">
            <span class="quick-icon quick-icon--tooling" aria-hidden="true"></span>
            <span>Tooling</span>
          </button>
          <button type="button" data-open="quotes">
            <span class="quick-icon quick-icon--quotes" aria-hidden="true"></span>
            <span>Quotes</span>
          </button>
          <button type="button" data-open="inventory">
            <span class="quick-icon quick-icon--inventory" aria-hidden="true"></span>
            <span>Inventory</span>
          </button>
          <button type="button" data-open="bom">
            <span class="quick-icon quick-icon--bom" aria-hidden="true"></span>
            <span>Rig / BOM</span>
          </button>
        </nav>
      </section>

      <section id="customerView" class="customer-view" aria-label="Customer Profile workspace" hidden>
        <header class="workspace-toolbar">
          <button id="customerBackButton" class="icon-button" type="button" aria-label="Back to MDB home">
            <span aria-hidden="true">&#8592;</span>
          </button>
          <h1>Customer Profile</h1>

          <div class="customer-search-wrap">
            <form id="customerSearchForm" class="compact-search" novalidate>
              <label class="sr-only" for="customerSearchInput">Search customers</label>
              <span class="search-mark" aria-hidden="true"></span>
              <input
                id="customerSearchInput"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Search customers..."
                aria-controls="customerSearchResults"
                aria-expanded="false"
              >
            </form>
            <div id="customerSearchResults" class="search-results search-results--compact" role="listbox" hidden></div>
          </div>

          <div class="workspace-actions">
            <button type="button" data-workspace="tooling">Tooling</button>
            <button type="button" data-workspace="quotes">Quotes</button>
            <div class="menu-wrap">
              <button
                id="calibrationButton"
                type="button"
                aria-expanded="false"
                aria-controls="calibrationMenu"
              >
                Calibration <span aria-hidden="true">&#9662;</span>
              </button>
              <div id="calibrationMenu" class="calibration-menu" hidden></div>
            </div>
          </div>
        </header>

        <div class="customer-workspace">
          <aside class="customer-directory" aria-label="All customers">
            <div class="directory-heading">
              <strong>All Customers</strong>
              <span>A-Z</span>
            </div>
            <label class="directory-filter">
              <span class="sr-only">Filter customer list</span>
              <span class="search-mark" aria-hidden="true"></span>
              <input id="directoryFilter" type="search" autocomplete="off" placeholder="Filter list...">
            </label>
            <div id="customerList" class="customer-list" role="list"></div>
          </aside>

          <section id="customerProfile" class="customer-profile" aria-live="polite">
            <div class="profile-empty">
              <span class="empty-mark" aria-hidden="true"></span>
              <strong>Select a customer</strong>
            </div>
          </section>
        </div>
      </section>
    </main>

    <section id="workspaceOverlay" class="workspace-overlay" aria-label="Workspace" hidden>
      <header class="overlay-toolbar">
        <button id="overlayBackButton" class="icon-button" type="button" aria-label="Close workspace">
          <span aria-hidden="true">&#8592;</span>
        </button>
        <div>
          <span id="overlayEyebrow"></span>
          <h2 id="overlayTitle"></h2>
        </div>
        <button id="overlayCloseButton" class="close-button" type="button" aria-label="Close workspace">&#215;</button>
      </header>
      <div id="overlayBody" class="overlay-body"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
